[[receiver]]
name = "tower-airspy"
kind = "airspy"
center_hz = 915_000_000
sample_rate = 2_500_000
gain = { lna = 12, mix = 12, vga = 12 }

[[receiver]]
name = "garage-nesdr"
kind = "rtlsdr"
index = 0
# Time-multiplexed over the bands the Airspy does not cover: Toyota TPMS at 315 MHz, 433 MHz ISM.
hop_hz = [315_000_000, 433_920_000]
dwell_s = 15
sample_rate = 2_400_000
gain = 40.2

[merge]
window_ms = 2000

[http]
bind = "0.0.0.0:8433"

[chirps]
# Rolling backlog of every burst that didn't decode (see README "Chirps"). The tower's 915 MHz
# AMI meter hopper alone produces ~20 bursts/s, so this is a ~20 minute window at 500 MB;
# `receivers = ["garage-nesdr"]` would make it a days-long backlog of the quiet bands instead.
path = "/var/lib/sensormon/chirps.db"
max_bytes = 500_000_000
max_examples_per_group = 3
# per emitter family (any center): ≤50 examples kept, ≤1 forwarded per 10 s per receiver thread
max_examples_per_family = 50
min_family_interval_s = 10
