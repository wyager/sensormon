[package]
name = "sensormon-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure DSP + protocol core for sensormon: burst detection, FSK demodulation, Fineoffset decoders, typed events. No I/O."

[dependencies]
num-complex = { version = "0.4", features = ["serde"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
